name: data-stack

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements-analytics-stack.txt
      - name: Data quality
        run: python analytics/quality/validate_published.py
      - name: DuckDB KPIs
        run: python analytics/run_sql_kpis.py
      - name: Build report + docs
        run: |
          python analytics/reports/build_report.py
          python tools/build_docs.py
